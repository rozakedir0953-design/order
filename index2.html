<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>order_summary</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="container">
        <div class="image_container">
            <img src="./images/illustration-hero.svg" alt="Hero illustration">
        </div>

        <div class="content_container">
            <h1>Order Summary</h1>
            <p>You can now listen to millions of songs, audiobooks, and podcasts on any device anywhere you like!</p>
        </div>

        <div class="plan_container">
            <div class="music">
                <img src="./images/icon-music.svg" alt="Music icon">
            </div>

            <div class="plan">
                <span class="plan-name">Annual Plan</span>
                <span class="price">$59.99/year</span>
            </div>

            <a class="change" href="#">Change</a>
        </div>

        <button class="btn1" type="button">Proceed to Payment</button>
        <button class="btn2" type="button">Cancel Order</button>
    </div>


</body>
</html>
